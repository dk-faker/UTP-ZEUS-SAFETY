<mat-card class="productos-card">
  <div class="header-productos">
    <h1>Gestión de Productos</h1>
    <button mat-flat-button color="primary" (click)="nuevoProducto()">
      <mat-icon>add_box</mat-icon>
      Nuevo Producto
    </button>
  </div>

  <mat-card class="tabla-card">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
      <!-- CODIGO -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef> CODIGO </th>
        <td mat-cell *matCellDef="let row"> {{ row.codigo }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- CATEGORIA -->
      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef> CATEGORIA </th>
        <td mat-cell *matCellDef="let row"> {{ row.categoria }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- TIPO -->
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> TIPO </th>
        <td mat-cell *matCellDef="let row"> {{ row.tipo }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- COLOR/TIPO -->
      <ng-container matColumnDef="color_tipo">
        <th mat-header-cell *matHeaderCellDef> COLOR/TIPO </th>
        <td mat-cell *matCellDef="let row"> {{ row.color_tipo }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- TAMAÑO -->
      <ng-container matColumnDef="tamano">
        <th mat-header-cell *matHeaderCellDef> TAMAÑO </th>
        <td mat-cell *matCellDef="let row"> {{ row.tamano }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- PARES POR CAJA -->
      <ng-container matColumnDef="pares_por_caja">
        <th mat-header-cell *matHeaderCellDef> PARES POR CAJA </th>
        <td mat-cell *matCellDef="let row"> {{ row.pares_por_caja }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="accent" (click)="editarProducto(row)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarProducto(row)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
      <tr class="no-data-row" *ngIf="dataSource.length === 0">
        <td colspan="7">
          <div class="no-data">No hay productos registrados todavía.</div>
        </td>
      </tr>
    </table>
  </mat-card>
  <mat-card class="formulario-placeholder">
    <h3>Formulario de Productos</h3>
  </mat-card>
</mat-card>
