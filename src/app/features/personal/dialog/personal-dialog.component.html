<h2 mat-dialog-title>
  {{ data.item ? 'Editar Personal' : 'Nuevo Personal' }}
</h2>

<mat-dialog-content>
  <div class="dialog-form" [formGroup]="form">
    <br>
    <!-- Nombre de usuario -->
    <mat-form-field appearance="outline" class="dialog-input">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput placeholder="Nombre de usuario" formControlName="nombre_usuario" />
      <mat-error *ngIf="form.get('nombre_usuario')?.hasError('required')">
        El nombre de usuario es requerido
      </mat-error>
      <mat-error *ngIf="form.get('nombre_usuario')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <!-- Clave -->
    <mat-form-field appearance="outline" class="dialog-input">
      <mat-label>Clave</mat-label>
      <input matInput type="password" placeholder="Clave" formControlName="clave" />
      <mat-error *ngIf="form.get('clave')?.hasError('required')">
        La clave es requerida
      </mat-error>
      <mat-error *ngIf="form.get('clave')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <!-- Rol -->
    <mat-form-field appearance="outline" class="dialog-input">
      <mat-label>Rol</mat-label>
      <input matInput placeholder="ID de rol" formControlName="id_rol" />
      <mat-error *ngIf="form.get('id_rol')?.hasError('required')">
        El rol es requerido
      </mat-error>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSave()">Guardar</button>
</mat-dialog-actions>
